services:
  app:
    build: .
    restart: unless-stopped
    environment:
      COOKIE_SECURE: "1"
    volumes:
      - project-data:/data
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
volumes:
  project-data:
  caddy-data:
